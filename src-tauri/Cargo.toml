[package]
name = "litespot"
version = "0.1.0"
description = "Litespot — a lightweight native shell for open.spotify.com"
authors = ["Litespot contributors"]
edition = "2021"
rust-version = "1.85"

# The library is what Tauri's mobile/desktop entrypoints call into.
[lib]
name = "litespot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"

[features]
# Default production features.
default = []

[profile.release]
# Aggressive size optimization — protects the "lightweight" footprint claim.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
